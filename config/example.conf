# Copy outside the repository, for example to /etc/sysadmin-toolkit/site.conf.
# Production configuration must be owned by root and not group/world writable.
PRIVILEGED_GROUPS="sudo docker"
AUTH_FAILURE_SINCE="24 hours ago"
FAIL_ON_SSH_ROOT_LOGIN=yes
FAIL_ON_SSH_PASSWORD_AUTH=no

# Space- or comma-separated port allowlists. Leave empty to inventory without
# classifying listeners as unexpected.
EXPECTED_TCP_LISTENERS="22 80 443"
EXPECTED_UDP_LISTENERS=""
FAIL_ON_UNEXPECTED_LISTENER=no

# WARN when APT metadata is older than this threshold.
MAX_APT_METADATA_AGE_HOURS=48

# Used when summarizing accounts whose last login predates the threshold.
MAX_DORMANT_DAYS=90
